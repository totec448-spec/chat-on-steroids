<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative ChatGPT tool approval prompt</title>
  <desc id="desc">A dark approval card for Chat On Steroids Core with Deny, Allow once, and Always allow buttons.</desc>
  <rect x="1" y="1" width="718" height="388" rx="28" fill="#202020" stroke="#3a3a3a" stroke-width="2"/>
  <text x="38" y="50" fill="#9a9a9a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" font-weight="600">ILLUSTRATIVE EXAMPLE</text>
  <text x="38" y="93" fill="#f4f4f4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="31" font-weight="650">Allow this tool call?</text>
  <rect x="38" y="118" width="644" height="122" rx="18" fill="#2b2b2b" stroke="#444"/>
  <circle cx="72" cy="154" r="16" fill="#3e4d63"/>
  <path d="M66 154h12M72 148v12" stroke="#d9e8ff" stroke-width="2.4" stroke-linecap="round"/>
  <text x="103" y="160" fill="#f2f2f2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23" font-weight="620">Chat On Steroids Core</text>
  <text x="103" y="197" fill="#c8c8c8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21">Read README.md from your shared project.</text>
  <line x1="38" y1="265" x2="682" y2="265" stroke="#3b3b3b"/>
  <rect x="38" y="292" width="188" height="62" rx="15" fill="#2a2a2a" stroke="#505050"/>
  <text x="132" y="331" text-anchor="middle" fill="#eeeeee" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="600">Deny</text>
  <rect x="266" y="292" width="188" height="62" rx="15" fill="#343434" stroke="#606060"/>
  <text x="360" y="331" text-anchor="middle" fill="#f4f4f4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="600">Allow once</text>
  <rect x="494" y="292" width="188" height="62" rx="15" fill="#f2f2f2"/>
  <text x="588" y="331" text-anchor="middle" fill="#171717" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="650">Always allow</text>
</svg>
