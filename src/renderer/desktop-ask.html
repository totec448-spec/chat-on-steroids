<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'" />
  <link rel="stylesheet" href="./desktop-ask.css" />
  <title>Chat On Steroids</title>
</head>
<body>
  <main class="desktop-ask" role="alertdialog" aria-labelledby="title" aria-describedby="step">
    <div class="desktop-ask-text">
      <h1 id="title"></h1>
      <p class="step" id="step"></p>
      <p class="chat" id="chat"></p>
    </div>
    <div class="desktop-ask-actions">
      <button type="button" class="btn" id="notNow"></button>
      <button type="button" class="btn btn-solid" id="go"></button>
    </div>
  </main>
  <script type="module" src="./desktop-ask.ts"></script>
</body>
</html>
