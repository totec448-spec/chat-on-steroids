[package]
name = "cos-control-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
description = "The opt-in local control API: /v1 reads, the event stream and gated actions."

[dependencies]
base64 = "=0.22.1"
bytes = "=1.12.1"
cos-http = { version = "0.1.0", path = "../cos-http" }
cos-input = { version = "0.1.0", path = "../cos-input" }
cos-sessions = { version = "0.1.0", path = "../cos-sessions" }
cos-store = { version = "0.1.0", path = "../cos-store" }
cos-tools = { version = "0.1.0", path = "../cos-tools" }
cos-types = { version = "0.1.0", path = "../cos-types" }
getrandom = "=0.2.17"
http = "=1.5.0"
hyper = "=1.12.0"
regex = "=1.13.1"
serde = "=1.0.229"
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
tokio = { version = "=1.54.0", features = ["sync", "fs", "rt", "time", "macros"] }

[dev-dependencies]
tokio = { version = "=1.54.0", features = ["rt-multi-thread", "macros", "io-util", "net"] }
