[package]
name = "cos-windows-capture"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
cos-sidecar-runtime = { path = "../cos-sidecar-runtime", version = "=0.1.0" }
serde_json = "=1.0.154"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
windows = { version = "=0.62.2", features = [
  "Foundation",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Graphics_Imaging",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_GdiPlus",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }
