[package]
name = "cos-sessions"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
description = "The session store under sessions/, its read model and tool-call recording."

[dependencies]
base64 = "=0.22.1"
cos-store = { version = "0.1.0", path = "../cos-store" }
cos-tools = { version = "0.1.0", path = "../cos-tools" }
cos-types = { version = "0.1.0", path = "../cos-types" }
getrandom = "=0.2.17"
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
sha2 = "=0.10.9"
tokio = { version = "=1.54.0", features = ["rt", "sync", "time"] }

[dev-dependencies]
cos-fs = { version = "0.1.0", path = "../cos-fs" }
tokio = { version = "=1.54.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
