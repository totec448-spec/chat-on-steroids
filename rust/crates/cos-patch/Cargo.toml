[package]
name = "cos-patch"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT AND Apache-2.0"
description = "The apply_patch tool."

[dependencies]
cos-fs = { version = "0.1.0", path = "../cos-fs" }
cos-tools = { version = "0.1.0", path = "../cos-tools" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
tokio = { version = "=1.54.0", features = ["rt"] }

[dev-dependencies]
cos-store = { version = "0.1.0", path = "../cos-store" }
cos-types = { version = "0.1.0", path = "../cos-types" }
tokio = { version = "=1.54.0", features = ["rt", "macros"] }
