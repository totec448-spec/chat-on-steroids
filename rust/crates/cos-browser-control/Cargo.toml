[package]
name = "cos-browser-control"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
description = "Direct browser control: the browser_* Desktop tools as short-lived RPCs the extension claims over the bridge, and the CoS sign-in transfer."

[dependencies]
base64 = "=0.22.1"
cos-fs = { version = "0.1.0", path = "../cos-fs" }
cos-tools = { version = "0.1.0", path = "../cos-tools" }
cos-types = { version = "0.1.0", path = "../cos-types" }
getrandom = "=0.2.17"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
tokio = { version = "=1.54.0", features = ["rt", "sync", "time"] }

[dev-dependencies]
cos-store = { version = "0.1.0", path = "../cos-store" }
tokio = { version = "=1.54.0", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }
