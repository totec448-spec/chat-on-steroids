[package]
name = "cos-windows-uia"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
cos-sidecar-runtime = { path = "../cos-sidecar-runtime", version = "=0.1.0" }
serde_json = "=1.0.154"

[target.'cfg(windows)'.dependencies]
uiautomation = { version = "=0.25.1", default-features = false, features = ["pattern", "input"] }
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
