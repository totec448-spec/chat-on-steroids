[package]
name = "cos-input"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
description = "The message outbox (waiting messages, browser claims and receipts) and the durable browser command ledger the extension redeems."

[dependencies]
base64 = "=0.22.1"
cos-sessions = { version = "0.1.0", path = "../cos-sessions" }
cos-store = { version = "0.1.0", path = "../cos-store" }
cos-tools = { version = "0.1.0", path = "../cos-tools" }
cos-types = { version = "0.1.0", path = "../cos-types" }
getrandom = "=0.2.17"
serde = "=1.0.229"
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
tokio = { version = "=1.54.0", features = ["rt", "sync", "time"] }

[dev-dependencies]
cos-recorder = { version = "0.1.0", path = "../cos-recorder" }
tokio = { version = "=1.54.0", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }
