[package]
name = "cos-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
description = "The Chat On Steroids Core: startup, shutdown, state ownership and the AppCore handle the UI links in-process."

[dependencies]
cos-agents = { version = "0.1.0", path = "../cos-agents" }
cos-bridge = { version = "0.1.0", path = "../cos-bridge" }
cos-codemode = { version = "0.1.0", path = "../cos-codemode" }
cos-browser-control = { version = "0.1.0", path = "../cos-browser-control" }
cos-companion = { version = "0.1.0", path = "../cos-companion" }
cos-continuation = { version = "0.1.0", path = "../cos-continuation" }
cos-connection = { version = "0.1.0", path = "../cos-connection" }
cos-control-api = { version = "0.1.0", path = "../cos-control-api" }
cos-exec = { version = "0.1.0", path = "../cos-exec" }
cos-files = { version = "0.1.0", path = "../cos-files" }
cos-goal = { version = "0.1.0", path = "../cos-goal" }
cos-fs = { version = "0.1.0", path = "../cos-fs" }
cos-input = { version = "0.1.0", path = "../cos-input" }
cos-mcp = { version = "0.1.0", path = "../cos-mcp" }
cos-patch = { version = "0.1.0", path = "../cos-patch" }
cos-recorder = { version = "0.1.0", path = "../cos-recorder" }
cos-secrets = { version = "0.1.0", path = "../cos-secrets" }
cos-sessions = { version = "0.1.0", path = "../cos-sessions" }
cos-store = { version = "0.1.0", path = "../cos-store" }
cos-tools = { version = "0.1.0", path = "../cos-tools" }
cos-types = { version = "0.1.0", path = "../cos-types" }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
tokio = { version = "=1.54.0", features = ["rt-multi-thread", "sync", "time", "signal", "macros"] }

[target.'cfg(windows)'.dependencies]
cos-windows-desktop = { version = "0.1.0", path = "../cos-windows-desktop" }

[build-dependencies]
serde_json = "=1.0.154"

[dev-dependencies]
tokio = { version = "=1.54.0", features = ["test-util", "macros", "rt"] }
