[package]
name = "cos-tools"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
description = "The model-facing tool kernel: tool trait, capability projection, monotonic exposure, error mapping and call accounting."

[dependencies]
cos-fs = { version = "0.1.0", path = "../cos-fs" }
cos-store = { version = "0.1.0", path = "../cos-store" }
cos-types = { version = "0.1.0", path = "../cos-types" }
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
tokio = { version = "=1.54.0", features = ["sync", "time"] }

[dev-dependencies]
tokio = { version = "=1.54.0", features = ["rt", "macros"] }
