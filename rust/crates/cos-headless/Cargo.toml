[package]
name = "cos-headless"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
description = "Chat On Steroids Core without a window, for differential tests and headless use."

[dependencies]
cos-core = { version = "0.1.0", path = "../cos-core" }
cos-store = { version = "0.1.0", path = "../cos-store" }
tokio = { version = "=1.54.0", features = ["rt", "sync", "signal", "macros"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "=0.62.2", features = ["Win32_System_Console"] }

[dev-dependencies]
cos-types = { version = "0.1.0", path = "../cos-types" }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
