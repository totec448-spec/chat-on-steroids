# cargo-about applies these licenses to all workspace dependencies. This is the
# complete policy allow-list, including MPL-2.0 for unmodified third-party code.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "0BSD",
]
ignore-build-dependencies = false
ignore-dev-dependencies = false
# cargo-about 0.9.2 can miss lowercase license-mit in these packaged
# windows-rs crates and fall back to a generic <year>/<copyright holders>
# template. Pin the actual package-supplied MIT text byte-for-byte instead.

[windows.clarify]
license = "MIT OR Apache-2.0"

[[windows.clarify.files]]
path = "license-mit"
license = "MIT"
checksum = "c2cfccb812fe482101a8f04597dfc5a9991a6b2748266c47ac91b6a5aae15383"

