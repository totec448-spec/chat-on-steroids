# Area labels for pull requests, from the files they change (actions/labeler).
'area: app':
  - changed-files:
      - any-glob-to-any-file: ['src/main/**']
'area: interface':
  - changed-files:
      - any-glob-to-any-file: ['src/renderer/**', 'src/preload/**']
'area: extension':
  - changed-files:
      - any-glob-to-any-file: ['extension/**']
'area: translations':
  - changed-files:
      - any-glob-to-any-file: ['src/renderer/locales/**', 'extension/_locales/**']
'area: ci':
  - changed-files:
      - any-glob-to-any-file: ['.github/**', 'scripts/**']
documentation:
  - changed-files:
      - any-glob-to-any-file: ['docs/**', '*.md']
