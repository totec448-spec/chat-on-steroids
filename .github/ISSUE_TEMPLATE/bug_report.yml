name: Bug report
description: Something behaved incorrectly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. This is a solo-maintained beta, so please be
        patient with response times.

        **If this is a security problem, stop here.** Use the repository's
        Security → Report a vulnerability flow instead of a public issue.

  - type: input
    id: version
    attributes:
      label: App version
      description: 'The exact number, shown under Settings → Activity or in the browser extension popup. "latest" is not accepted: reports without a version number are closed until one is added. Stable releases only; canary builds are not supported.'
      placeholder: "2.1.32"
    validations:
      required: true

  - type: checkboxes
    id: latest
    attributes:
      label: Latest release
      description: Many problems are already fixed in a newer version. Update under Settings → Activity first, then check whether it still happens.
      options:
        - label: I reproduced this on the latest release
          required: true

  - type: input
    id: operating_system
    attributes:
      label: Operating system and version
      placeholder: "Windows 11 24H2, macOS 15.6, Ubuntu 24.04, …"
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - "x64 (Intel/AMD)"
        - "ARM64"
        - "Not sure"
    validations:
      required: true

  - type: dropdown
    id: extension
    attributes:
      label: Was the Chrome extension connected?
      options:
        - "Yes, and its version matches the app"
        - "Yes, but I am not sure the versions match"
        - "No"
        - "I do not have the extension installed"
    validations:
      required: true

  - type: dropdown
    id: chatgpt_access
    attributes:
      label: ChatGPT plan
      description: Report the plan shown in your account. This does not establish which models or connector actions are available.
      options:
        - "Free"
        - "Go"
        - "Plus"
        - "Pro"
        - "Business"
        - "Enterprise or Edu"
        - "Other or not sure"
        - "Not relevant to this bug"
    validations:
      required: true

  - type: input
    id: chatgpt_surface
    attributes:
      label: ChatGPT surface and workspace type
      description: For connector or model issues, say whether you used Chat or Work and a Personal or managed workspace. Do not include workspace names or IDs.
      placeholder: "Chat, Personal workspace"

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what happened, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Recommended. The exact steps let us reproduce it without asking.
      placeholder: |
        1.
        2.
        3.

  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      description: Recommended.
      options:
        - "Every time"
        - "Sometimes"
        - "It happened once"

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot or screen recording
      description: Recommended when the problem shows in the app or the browser. Drag the image or video here. Hide chat text and names you don't want to share.

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics report
      description: >
        Required. In the app, open Activity and click Diagnostics report, then drag the saved file into this box.
        Your user name, folder and file names, chat titles, tasks, email addresses and keys are already
        replaced in it. Please read it before you attach it. If the app does not open at all, attach its app.log
        instead (macOS: ~/Library/Application Support/chat-on-steroids, Windows: %APPDATA%\chat-on-steroids,
        Linux: ~/.config/chat-on-steroids). Reports without either are closed until one is added.
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: >
        Relevant log output, or which permissions were enabled at the time.
        Remove secrets, personal file contents, usernames/paths, conversation text,
        and account/workspace identifiers before posting.
      render: text
