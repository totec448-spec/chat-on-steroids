name: Bug report
description: Something behaved incorrectly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. This is a solo-maintained beta, so please be
        patient with response times.

        **If this is a security problem, stop here.** Use the repository's
        Security → Report a vulnerability flow instead of a public issue.

  - type: input
    id: version
    attributes:
      label: App version
      description: Activity → update status, or the browser companion popup. Stable releases only; canary builds are not supported.
      placeholder: "1.9.4"
    validations:
      required: true

  - type: input
    id: operating_system
    attributes:
      label: Operating system and version
      placeholder: "Windows 11 24H2, macOS 15.6, Ubuntu 24.04, …"
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - "x64 (Intel/AMD)"
        - "ARM64"
        - "Not sure"
    validations:
      required: true

  - type: dropdown
    id: extension
    attributes:
      label: Was the Chrome extension connected?
      options:
        - "Yes, and its version matches the app"
        - "Yes, but I am not sure the versions match"
        - "No"
        - "I do not have the extension installed"
    validations:
      required: true

  - type: dropdown
    id: chatgpt_access
    attributes:
      label: ChatGPT plan
      description: Report the plan shown in your account. This does not establish which models or connector actions are available.
      options:
        - "Free"
        - "Go"
        - "Plus"
        - "Pro"
        - "Business"
        - "Enterprise or Edu"
        - "Other or not sure"
        - "Not relevant to this bug"
    validations:
      required: true

  - type: input
    id: chatgpt_surface
    attributes:
      label: ChatGPT surface and workspace type
      description: For connector or model issues, say whether you used Chat or Work and a Personal or managed workspace. Do not include workspace names or IDs.
      placeholder: "Chat, Personal workspace"

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what happened, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics report
      description: >
        In the app, open Activity and click Diagnostics report, then drag the saved file into this box.
        Your user name, folder and file names, chat titles, tasks, email addresses and keys are already
        replaced in it. Please read it before you attach it.

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: >
        Relevant log output, or which permissions were enabled at the time.
        Remove secrets, personal file contents, usernames/paths, conversation text,
        and account/workspace identifiers before posting.
      render: text
