name: Bug report
description: Something behaved incorrectly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. This is a solo-maintained beta, so please be
        patient with response times.

        **If this is a security problem, stop here.** Use the repository's
        Security → Report a vulnerability flow instead of a public issue.

  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → About.
      placeholder: "1.9.4"
    validations:
      required: true

  - type: input
    id: operating_system
    attributes:
      label: Operating system and version
      placeholder: "Windows 11 24H2, macOS 15.6, Ubuntu 24.04, …"
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - "x64 (Intel/AMD)"
        - "ARM64"
        - "Not sure"
    validations:
      required: true

  - type: dropdown
    id: extension
    attributes:
      label: Was the Chrome extension connected?
      options:
        - "Yes, and its version matches the app"
        - "Yes, but I am not sure the versions match"
        - "No"
        - "I do not have the extension installed"
    validations:
      required: true

  - type: dropdown
    id: chatgpt_access
    attributes:
      label: ChatGPT workspace / custom MCP access
      description: Select the closest match. OpenAI plan and workspace policy can affect custom app behavior.
      options:
        - "Business"
        - "Enterprise or Edu"
        - "Pro (custom MCP read/fetch only)"
        - "Other or not sure"
        - "Not relevant to this bug"
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what happened, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: >
        Relevant log output, or which permissions were enabled at the time.
        Remove secrets, personal file contents, usernames/paths, conversation text,
        and account/workspace identifiers before posting.
      render: text
