name: Draft release notes

# A starting point for docs/release-notes/vX.Y.Z.md: every PR merged since the latest release,
# using its optional "Release note:" line, else its title. The draft appears in the run summary
# and as an artifact; nothing is committed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  draft:
    if: github.repository == 'totec448-spec/chat-on-steroids'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Draft the notes
        run: |
          node scripts/draft-release-notes.mjs draft.md
          cat draft.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes-draft
          path: draft.md
          retention-days: 14
