name: Verify published release

# What users download, checked right after it is published: every file matches SHA256SUMS.txt and
# the published Chromium extension package is a tagged build. A problem opens an issue instead of waiting for a
# user report. publish.yml calls it right after publishing: a release created with the workflow's
# own token triggers no other workflow, so `release: published` alone never ran for our releases.
# It can also be run by hand for any existing tag.
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: Release tag to verify
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify, for example v2.1.21
        required: true

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'totec448-spec/chat-on-steroids'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install the checker's dependencies
        # Only fflate is needed; skipping install scripts avoids the Electron download.
        run: npm ci --ignore-scripts
      - name: Download the published files
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets
      - name: Verify checksums and extension package
        run: node scripts/verify-release-assets.mjs assets "$TAG" problems.md
      - name: Open an issue when the release is not sound
        if: failure()
        run: |
          {
            echo "The published files of $TAG failed verification ([run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)):"
            echo
            if [ -s problems.md ]; then cat problems.md; else echo "- The files could not be downloaded or checked; see the run log."; fi
          } > issue.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Release $TAG: published files failed verification" --body-file issue.md
