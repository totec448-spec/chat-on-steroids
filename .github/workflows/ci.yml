name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Checks that read the source, not the OS: once, on Linux, beside the test shards (CI speed-up
    # 2026-10-31; they used to run before the tests on every OS).
    name: Typecheck, privacy and notices
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Privacy
        run: npm run verify:privacy

      - name: Third-party notices and native sources
        run: npm run verify:notices

      - name: Typecheck
        run: npm run typecheck

  verify:
    # The unit tests in parallel shards, balanced by measured seconds (test/weighted-sequencer.ts,
    # test/test-weights.json). Three shards on Windows, its slowest runner; two elsewhere. macOS keeps
    # to two because the account runs at most five macOS jobs at once, and its UI checks take three.
    name: Verify ${{ matrix.name }} (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, runner: windows-2025, shard: '1/3', first: true }
          - { name: Windows x64, runner: windows-2025, shard: '2/3', first: false }
          - { name: Windows x64, runner: windows-2025, shard: '3/3', first: false }
          - { name: macOS arm64, runner: macos-15, shard: '1/2', first: true }
          - { name: macOS arm64, runner: macos-15, shard: '2/2', first: false }
          - { name: Linux x64, runner: ubuntu-24.04, shard: '1/2', first: true }
          - { name: Linux x64, runner: ubuntu-24.04, shard: '2/2', first: false }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch ripgrep and check Electron loads
        run: |
          npm run rg
          node -e "require('electron')"

      - name: Unit tests
        env:
          # One retry per failed test; scripts/flaky-reporter.mjs lists every test that needed it.
          COS_TEST_RETRY: '1'
        run: npx vitest run --shard=${{ matrix.shard }} --exclude test/mcp-shutdown.test.ts --exclude test/computer.test.ts

      - name: Tests that need the machine to themselves
        if: matrix.first
        env:
          COS_TEST_RETRY: '1'
        run: npx vitest run --maxWorkers=1 test/computer.test.ts test/mcp-shutdown.test.ts

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.first
        with:
          python-version: '3.12'

      - name: Install plugin Python runtime
        if: matrix.first
        run: python -m pip install uv==0.12.5

      - name: Exercise published plugins on this OS
        if: matrix.first
        env:
          COS_PLUGIN_LIVE_TEST: '1'
        # These suites install full npm/Python environments and immediately start
        # their servers. Give each cold start the runner without competing installs.
        run: npx vitest run --maxWorkers=1 test/plugins-live-proxy.test.ts test/plugins-python-live.test.ts test/plugins-catalog-live.test.ts

  ui:
    # The real-Electron UI checks (scripts/verify-*.cjs) catch layout and interaction bugs the unit
    # tests cannot see. They take several minutes, so they run only when the interface can change.
    name: UI checks (macOS ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        # Balanced by scripts/ui-check-weights.json; about six minutes each instead of fifteen in a row.
        shard: ['1/3', '2/3', '3/3']
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The interface decision needs the history, not old file contents.
          fetch-depth: 0
          filter: blob:none

      - name: Decide whether the interface can change
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -z "$BASE_REF" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "origin/$BASE_REF...HEAD" | grep -qE '^(src/renderer/|src/preload/|src/shared/|extension/|scripts/verify-|scripts/fixtures/|package(-lock)?\.json$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No interface files changed; the UI checks are skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: npm ci

      - name: Build the app
        if: steps.scope.outputs.run == 'true'
        run: npm run build

      - name: Verify recovery capture on the hosted compositor
        if: steps.scope.outputs.run == 'true' && matrix.shard == '1/3'
        # These two focused gates run exactly once: no UI skip list, retry loop or timeout wrapper.
        # Recovery uses the offscreen paint frame directly; Plan owns its media preference through
        # CDP, so both can be validated on the hosted macOS renderer before the broader UI suite.
        run: env -u ELECTRON_RUN_AS_NODE ./node_modules/.bin/electron scripts/verify-recovery-layout.cjs

      - name: Verify Plan motion matrix on hosted macOS
        if: steps.scope.outputs.run == 'true' && matrix.shard == '1/3'
        run: env -u ELECTRON_RUN_AS_NODE ./node_modules/.bin/electron scripts/verify-plan-collapse.cjs

      - name: Run the UI checks
        if: steps.scope.outputs.run == 'true'
        env:
          # The Plan motion matrix ran in its own step above. The focus-ring pixel comparison and the
          # transparent pet overlay need a real GPU; the hosted runner has none. They run with npm run
          # verify:ui on a real machine. The built-in browser's sign-in check (local TLS sites behind a
          # proxied session) exits within seconds on the hosted macOS runner, before its first step; it
          # passes on Windows and locally.
          VERIFY_UI_SKIP: verify-plan-collapse.cjs,verify-settings-focus.cjs,verify-pet-overlay-electron.cjs,verify-cos-sign-in.cjs
          # The shared runner times out a different check now and then; one retry each, named as flaky.
          VERIFY_UI_RETRY: '1'
          VERIFY_UI_SHARD: ${{ matrix.shard }}
        run: npm run verify:ui

      - name: Keep the UI check screenshots when a check fails
        if: failure() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-check-screenshots-${{ github.run_id }}-${{ strategy.job-index }}
          path: outputs/
          if-no-files-found: ignore
          retention-days: 7

  ui-windows:
    # The same real-Electron UI checks on Windows, where hidden windows animate nothing and the
    # runner's screen is small by default: both broke checks that pass on macOS (VM 141, 2026-10-06).
    name: UI checks (Windows ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The interface decision needs the history, not old file contents.
          fetch-depth: 0
          filter: blob:none

      - name: Decide whether the interface can change
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -z "$BASE_REF" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "origin/$BASE_REF...HEAD" | grep -qE '^(src/renderer/|src/preload/|src/shared/|extension/|scripts/verify-|scripts/fixtures/|package(-lock)?\.json$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No interface files changed; the UI checks are skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Give the checks a full-size screen
        if: steps.scope.outputs.run == 'true'
        # The checks open windows up to 1400x1000; on a smaller screen Windows clamps them and the
        # layouts they measure are not the ones they were written for.
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: npm ci

      - name: Build the app
        if: steps.scope.outputs.run == 'true'
        run: npm run build

      - name: Run the UI checks
        if: steps.scope.outputs.run == 'true'
        env:
          # The same GPU-bound checks as on macOS. The Plan motion matrix and the reactions check run
          # here in the suite (both passed repeatedly on a GPU-less Windows VM).
          VERIFY_UI_SKIP: verify-settings-focus.cjs,verify-pet-overlay-electron.cjs
          VERIFY_UI_RETRY: '1'
          VERIFY_UI_SHARD: ${{ matrix.shard }}
        run: npm run verify:ui

      - name: Keep the UI check screenshots when a check fails
        if: failure() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-check-screenshots-windows-${{ github.run_id }}-${{ strategy.job-index }}
          path: outputs/
          if-no-files-found: ignore
          retention-days: 7
