name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
          - name: macOS arm64
            runner: macos-15
          - name: Linux x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify:ci

  dispatch-release-proof:
    if: github.event_name == 'pull_request' && github.head_ref == 'release-proof-pr-v2.0.2-20260826'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify frozen candidate and dispatch release proof
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_BRANCH: release/v2.0.2-final-20260826
          EXPECTED_COMMIT: ac1e212fe96d8170ecbd2c326389a59c3ad369bf
          EXPECTED_TREE: 8d58a9d74a993d2530e10bef47cfd35b51ea0ffd
          EXPECTED_MAIN: bd2d6fde6c5687e0b5abb0abe1ff327555d33538
        run: |
          set -euo pipefail
          test "$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/main --jq .object.sha)" = "$EXPECTED_MAIN"
          test "$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/$FINAL_BRANCH --jq .object.sha)" = "$EXPECTED_COMMIT"
          test "$(gh api repos/${GITHUB_REPOSITORY}/git/commits/$EXPECTED_COMMIT --jq .tree.sha)" = "$EXPECTED_TREE"
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$FINAL_BRANCH"
