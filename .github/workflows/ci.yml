name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
          - name: macOS arm64
            runner: macos-15
          - name: Linux x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify:ci

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install plugin Python runtime
        run: python -m pip install uv==0.12.5

      - name: Exercise published plugins on this OS
        env:
          COS_PLUGIN_LIVE_TEST: '1'
        # These suites install full npm/Python environments and immediately start
        # their servers. Give each cold start the runner without competing installs.
        run: npx vitest run --maxWorkers=1 test/plugins-live-proxy.test.ts test/plugins-python-live.test.ts test/plugins-catalog-live.test.ts

  ui:
    # The real-Electron UI checks (scripts/verify-*.cjs) catch layout and interaction bugs the unit
    # tests cannot see. They take several minutes, so they run only when the interface can change.
    name: UI checks (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Decide whether the interface can change
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -z "$BASE_REF" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "origin/$BASE_REF...HEAD" | grep -qE '^(src/renderer/|src/preload/|src/shared/|extension/|scripts/verify-|scripts/fixtures/|package(-lock)?\.json$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No interface files changed; the UI checks are skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: npm ci

      - name: Build the app
        if: steps.scope.outputs.run == 'true'
        run: npm run build

      - name: Run the UI checks
        if: steps.scope.outputs.run == 'true'
        run: npm run verify:ui

      - name: Keep the UI check screenshots when a check fails
        if: failure() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-check-screenshots-${{ github.run_id }}
          path: outputs/
          if-no-files-found: ignore
          retention-days: 7
