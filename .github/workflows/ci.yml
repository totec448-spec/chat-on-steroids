name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify:ci

  dispatch_release_proof:
    name: Dispatch exact v2.0.2 release proof
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify exact candidate and dispatch release.yml
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_BRANCH: release/v2.0.2-final-20260826
          EXPECTED_COMMIT: ac1e212fe96d8170ecbd2c326389a59c3ad369bf
          EXPECTED_TREE: 8d58a9d74a993d2530e10bef47cfd35b51ea0ffd
          EXPECTED_MAIN: bd2d6fde6c5687e0b5abb0abe1ff327555d33538
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/main --jq .object.sha)" = "$EXPECTED_MAIN"
          test "$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/$FINAL_BRANCH --jq .object.sha)" = "$EXPECTED_COMMIT"
          test "$(gh api repos/${GITHUB_REPOSITORY}/git/commits/$EXPECTED_COMMIT --jq .tree.sha)" = "$EXPECTED_TREE"
          gh workflow run release.yml --ref "$FINAL_BRANCH"
