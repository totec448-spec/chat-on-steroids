name: Publish release

# Dispatch this at the tag you want released:
#   gh workflow run publish.yml --ref v2.0.2
#
# It builds the candidate itself rather than adopting one from an earlier run, so the
# installers attached to a release are provably the ones produced from that tag by the
# pipeline in that tag's own tree.
on:
  workflow_dispatch:
    inputs:
      firefox_build:
        description: 'Firefox-only fourth version part (1 makes the add-on 2.1.43.1). Only when Mozilla already holds this version; it never signs one twice.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}

    steps:
      # Fail cheap before allocating the six native packaging runners. The final publish step
      # repeats the release-exists check to close the race while the candidate is building.
      - name: Refuse to publish from anything but a tag
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "publish.yml must be dispatched at a tag; got $GITHUB_REF_TYPE $TAG" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify tag matches package version
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match package version $version" >&2
            exit 1
          fi

      - name: Verify release metadata agrees
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          const manifest = require('./extension/manifest.json');
          const versionSource = fs.readFileSync('src/main/version.ts', 'utf8');
          const appVersion = versionSource.match(/APP_VERSION = '([^']+)'/)?.[1];
          const versions = [pkg.version, lock.version, lock.packages?.['']?.version, manifest.version, appVersion];
          if (versions.some((version) => version !== pkg.version)) {
            throw new Error(`Release versions disagree: ${versions.join(', ')}`);
          }

          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const changelogVersion = changelog.match(/^## \[(\d+\.\d+\.\d+)\]/m)?.[1];
          if (changelogVersion !== pkg.version) {
            throw new Error(`Top changelog entry ${changelogVersion ?? '<missing>'} does not match ${pkg.version}`);
          }

          const notesPath = `docs/release-notes/v${pkg.version}.md`;
          if (!fs.existsSync(notesPath)) throw new Error(`Missing ${notesPath}`);
          const notes = fs.readFileSync(notesPath, 'utf8');
          if (!/^## .+$/m.test(notes)) throw new Error(`${notesPath} has no release title`);
          NODE

      # A release remains reproducible because the tunnel bytes are version/checksum pinned.
      # Refuse a stale pin instead of silently changing the payload named by this tag.
      - name: Require current OpenAI tunnel-client
        run: npm run verify:tunnel-current

      - name: Verify public-history privacy
        run: node scripts/verify-public-history.mjs

      - name: Require reviewed release notes for this tag
        run: |
          set -euo pipefail
          notes="docs/release-notes/$TAG.md"
          if [ ! -s "$notes" ]; then
            echo "Missing $notes — write the release notes and tag again." >&2
            exit 1
          fi

      - name: Refuse an existing release
        run: node scripts/check-release-absent.mjs

  candidate:
    name: Build candidate
    needs: preflight
    uses: ./.github/workflows/release.yml

  # Mozilla signs each add-on version once, so the Firefox add-on is signed here, for a tag, and
  # never by canary builds. Self-hosted ("unlisted"): the release carries the signed package and
  # firefox-updates.json, which the add-on's update_url reads from the latest release.
  firefox-addon:
    name: Sign the Firefox add-on
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Same stamp as the packaged app, so app and add-on agree on the build they run.
      - name: Stage the Firefox add-on
        env:
          FIREFOX_BUILD: ${{ inputs.firefox_build }}
        run: |
          set -euo pipefail
          node scripts/write-extension-stamp.mjs
          node scripts/stage-firefox-extension.mjs release/firefox-extension
          npx --yes web-ext@10.7.0 lint --source-dir release/firefox-extension --self-hosted

      - name: Sign with Mozilla
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          FIREFOX_BUILD: ${{ inputs.firefox_build }}
        run: |
          set -euo pipefail
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "::error::Set the AMO_JWT_ISSUER and AMO_JWT_SECRET repository secrets (addons.mozilla.org → Manage API Keys)." >&2
            exit 1
          fi
          npx --yes web-ext@10.7.0 sign --channel=unlisted --source-dir release/firefox-extension \
            --artifacts-dir release/firefox-signed --approval-timeout 1500000
          shopt -s nullglob
          signed=(release/firefox-signed/*.xpi)
          if [ "${#signed[@]}" -ne 1 ]; then echo "Expected one signed package, found ${#signed[@]}" >&2; exit 1; fi
          mkdir -p release/firefox
          cp "${signed[0]}" release/firefox/Chat-On-Steroids-Firefox.xpi
          node scripts/firefox-update-manifest.mjs release/firefox/Chat-On-Steroids-Firefox.xpi "${TAG#v}${FIREFOX_BUILD:+.$FIREFOX_BUILD}" release/firefox/firefox-updates.json
          cat release/firefox/firefox-updates.json

      - name: Upload the signed add-on
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firefox-addon-${{ github.run_id }}
          path: release/firefox/
          if-no-files-found: error

  publish:
    name: Publish
    needs: [candidate, firefox-addon]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}

    steps:
      # A branch has no version guarantee — release.yml only checks the tag against
      # package.json when the ref is a tag — so a branch must never reach `gh release create`.
      - name: Refuse to publish from anything but a tag
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "publish.yml must be dispatched at a tag; got $GITHUB_REF_TYPE $TAG" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify public-history privacy
        run: node scripts/verify-public-history.mjs

      # Release notes are written by hand and reviewed in the tagged tree. Generating
      # them here would mean the release said something nobody read before it shipped.
      - name: Require reviewed release notes for this tag
        run: |
          set -euo pipefail
          notes="docs/release-notes/$TAG.md"
          if [ ! -s "$notes" ]; then
            echo "Missing $notes — write the release notes and tag again." >&2
            exit 1
          fi

      - name: Download the candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chat-on-steroids-candidate-${{ github.run_id }}
          path: publish

      # The checksums were computed on the packaging runner. Re-checking them here proves
      # the bytes about to be attached are the bytes that were smoke-tested.
      - name: Re-verify the checksums
        working-directory: publish
        run: |
          set -euo pipefail
          cat SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Download the signed Firefox add-on
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: firefox-addon-${{ github.run_id }}
          path: publish

      # Signed after the candidate's checksums were made, so its lines are added here.
      - name: Add the signed Firefox add-on
        working-directory: publish
        run: |
          set -euo pipefail
          sha256sum Chat-On-Steroids-Firefox.xpi firefox-updates.json >> SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Publish the release
        run: |
          set -euo pipefail
          # Repeat after the native candidate build so a new upstream release published while
          # the six runners were working cannot leave this release stale.
          npm run verify:tunnel-current
          node scripts/check-release-absent.mjs
          gh release create "$TAG" \
            publish/Chat-On-Steroids-Setup-x64.exe \
            publish/Chat-On-Steroids-Setup-arm64.exe \
            publish/Chat-On-Steroids-macOS-x64.dmg \
            publish/Chat-On-Steroids-macOS-x64.zip \
            publish/Chat-On-Steroids-macOS-arm64.dmg \
            publish/Chat-On-Steroids-macOS-arm64.zip \
            publish/Chat-On-Steroids-Linux-x64.AppImage \
            publish/Chat-On-Steroids-Linux-x64.deb \
            publish/Chat-On-Steroids-Linux-arm64.AppImage \
            publish/Chat-On-Steroids-Linux-arm64.deb \
            publish/Chat-On-Steroids-Extension.zip \
            publish/Chat-On-Steroids-Native-Sources.tar.gz \
            publish/Chat-On-Steroids-Firefox.xpi \
            publish/firefox-updates.json \
            publish/SHA256SUMS.txt \
            --title "$(sed -n 's/^## //p' "docs/release-notes/$TAG.md" | head -n 1)" \
            --notes-file "docs/release-notes/$TAG.md"
          gh release view "$TAG" --json url --jq .url

  verify:
    name: Verify published files
    needs: publish
    uses: ./.github/workflows/verify-release.yml
    with:
      tag: ${{ github.ref_name }}
    permissions:
      contents: read
      issues: write
