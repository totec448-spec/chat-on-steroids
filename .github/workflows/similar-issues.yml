name: Similar issues

# Points a new issue to existing ones with a very similar title, as a hint, never a verdict: only
# close matches are mentioned, nothing is labeled or closed, and nothing is said when none is close.
on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  hint:
    if: github.repository == 'totec448-spec/chat-on-steroids'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Mention very similar issues
        run: node scripts/similar-issues.mjs
