name: Similar issues

# Points a new issue to existing ones with a very similar title, as a hint, never a verdict: only
# close matches are mentioned, nothing is labeled or closed, and nothing is said when none is close.
on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  hint:
    if: github.repository == 'totec448-spec/chat-on-steroids'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Mention very similar issues
        run: node scripts/similar-issues.mjs
