name: Update flake.lock

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-flake-lock
  cancel-in-progress: false

jobs:
  update:
    name: Refresh Nix inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UPDATE_BRANCH: automation/update-flake-lock
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Update and validate flake.lock
        id: update
        shell: bash
        run: |
          set -euo pipefail
          nix flake update

          if git diff --quiet -- flake.lock; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          nix flake check --all-systems --no-build
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Open or refresh update pull request
        if: steps.update.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$UPDATE_BRANCH"
          git add flake.lock
          git commit -m 'chore(nix): update flake.lock'
          git push --force origin "HEAD:$UPDATE_BRANCH"

          body=$(cat <<'PR_BODY'
          Refs #764

          ## Why

          Keep the pinned nixpkgs revision current without requiring maintainers to run Nix locally.

          ## What changed

          Refresh `flake.lock` using `nix flake update`. The scheduled workflow validates all declared systems before publishing this pull request.

          ## Test

          No test: dependency lock refresh only; the update workflow runs `nix flake check --all-systems --no-build` before creating this PR.

          ## Checklist

          - [x] `nix flake check --all-systems --no-build` passes on the GitHub Ubuntu runner.
          - [x] The PR contains only the generated `flake.lock` update.
          - [x] No logs, local paths, IDs or credentials are included.
          PR_BODY
          )

          existing=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$UPDATE_BRANCH" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [[ -n "$existing" ]]; then
            gh pr edit "$existing" \
              --repo "$GITHUB_REPOSITORY" \
              --title 'chore(nix): update flake.lock' \
              --body "$body"
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$UPDATE_BRANCH" \
              --title 'chore(nix): update flake.lock' \
              --body "$body"
          fi
