name: PR triage

# Friendly helpers for open pull requests, including ones from forks: area labels, one note on
# very large PRs, and one welcome for a first-time contributor. Never fails a PR. It runs on a
# schedule with the repository's own code instead of pull_request_target, which GitHub restricts
# on public repositories from November 2026; no pull request code is ever checked out or run.
on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  triage:
    if: github.repository == 'totec448-spec/chat-on-steroids'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Label, note and welcome open PRs
        run: node scripts/pr-triage.mjs
