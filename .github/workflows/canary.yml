name: Canary

# Test builds of main, published as one rolling prerelease named `canary`:
#   gh workflow run canary.yml --ref main
#
# Not a release. It builds the same candidate as publish.yml (release.yml) and attaches it
# without release notes. There is no support: issues and pull requests are accepted only for
# problems that reproduce on the latest stable release. The in-app update check reads
# releases/latest, which never returns a prerelease, so no stable install is offered a canary,
# and a canary install is offered the next stable release as usual.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canary
  cancel-in-progress: true

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Build canaries from main only
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "canary.yml must be dispatched at main; got $GITHUB_REF" >&2
            exit 1
          fi

  candidate:
    name: Build candidate
    needs: preflight
    uses: ./.github/workflows/release.yml

  publish:
    name: Publish canary
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify public-history privacy
        run: node scripts/verify-public-history.mjs

      - name: Download the candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chat-on-steroids-candidate-${{ github.run_id }}
          path: publish

      - name: Re-verify the checksums
        working-directory: publish
        run: |
          set -euo pipefail
          cat SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      # One canary at a time: the previous one and its tag are replaced, never kept beside it.
      - name: Replace the canary prerelease
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          short="${GITHUB_SHA::12}"
          cat > canary-notes.md <<NOTES
          Test build of \`main\` at ${short}, after ${version}. **Not a release.**

          - No release notes and no support. It can be broken.
          - Issues and pull requests are accepted only for problems that also happen on the [latest stable release](https://github.com/${GITHUB_REPOSITORY}/releases/latest).
          - The app does not offer canary builds as updates. It offers the next stable release as usual.
          NOTES
          if gh release view canary >/dev/null 2>&1; then
            gh release delete canary --cleanup-tag --yes
          fi
          gh release create canary \
            publish/Chat-On-Steroids-Setup-x64.exe \
            publish/Chat-On-Steroids-Setup-arm64.exe \
            publish/Chat-On-Steroids-macOS-x64.dmg \
            publish/Chat-On-Steroids-macOS-x64.zip \
            publish/Chat-On-Steroids-macOS-arm64.dmg \
            publish/Chat-On-Steroids-macOS-arm64.zip \
            publish/Chat-On-Steroids-Linux-x64.AppImage \
            publish/Chat-On-Steroids-Linux-x64.deb \
            publish/Chat-On-Steroids-Linux-arm64.AppImage \
            publish/Chat-On-Steroids-Linux-arm64.deb \
            publish/Chat-On-Steroids-Extension.zip \
            publish/SHA256SUMS.txt \
            --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Canary ${short} (not a release)" \
            --notes-file canary-notes.md
          gh release view canary --json url,isPrerelease --jq '"\(.url) prerelease=\(.isPrerelease)"'
