name: Canary

# Test builds of main, published as one rolling prerelease at the fixed `canary` tag. Every push
# to main that can change the app builds one; it can also be started by hand:
#   gh workflow run canary.yml --ref main
#
# Not a release. It builds the same candidate as publish.yml (release.yml) and attaches it
# without release notes. There is no support: issues and pull requests are accepted only for
# problems that reproduce on the latest stable release. The in-app update check reads
# releases/latest, which never returns a prerelease, so no stable install is offered a canary,
# and a canary install is offered the next stable release as usual.
on:
  push:
    branches: [main]
    # Changes that cannot change the packaged app do not need a new build.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'test/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a run in progress: a replacement is staged and verified as a private draft before
# the fixed public canary is swapped. GitHub keeps only the newest waiting run in the group, so a
# burst of merges still converges on one build of the latest app-relevant main.
concurrency:
  group: canary
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Build canaries from main only
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "canary.yml must be dispatched at main; got $GITHUB_REF" >&2
            exit 1
          fi

  candidate:
    name: Build candidate
    needs: preflight
    uses: ./.github/workflows/release.yml
    with:
      # Only the targets most installs use; see scripts/release-targets.mjs.
      platforms: common

  publish:
    name: Publish canary
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify public-history privacy
        run: node scripts/verify-public-history.mjs

      - name: Download the candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chat-on-steroids-candidate-${{ github.run_id }}
          path: publish

      - name: Re-verify the checksums
        working-directory: publish
        run: |
          set -euo pipefail
          cat SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Limit checksums to published canary assets
        working-directory: publish
        run: |
          set -euo pipefail
          # release.yml always includes the native-source archive in the candidate so the full
          # candidate can be verified above. Canary intentionally does not attach that archive;
          # do not publish a checksum manifest that names a file users cannot download here.
          grep -Fq '  Chat-On-Steroids-Native-Sources.tar.gz' SHA256SUMS.txt || {
            echo 'Candidate checksum manifest is missing the native-source archive.' >&2
            exit 1
          }
          grep -vF '  Chat-On-Steroids-Native-Sources.tar.gz' SHA256SUMS.txt > SHA256SUMS.canary.txt
          mv SHA256SUMS.canary.txt SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Stage and verify the complete replacement before touching the fixed public canary. A stale
      # run or a failed upload therefore leaves the previous /releases/tag/canary intact.
      - name: Replace the canary prerelease
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          short="${GITHUB_SHA::12}"
          cat > canary-notes.md <<NOTES
          Test build of \`main\` at ${short}, after ${version}. **Not a release.**
          Built for the platforms most installs use: Windows x64, macOS on Apple silicon and Linux x64.

          - No release notes and no support. It can be broken.
          - Issues and pull requests are accepted only for problems that also happen on the [latest stable release](https://github.com/${GITHUB_REPOSITORY}/releases/latest).
          - The app does not offer canary builds as updates. It offers the next stable release as usual.
          NOTES
          # Whatever the candidate packaged, without the native sources archive a release keeps.
          mapfile -t assets < <(find publish -maxdepth 1 -name 'Chat-On-Steroids-*' ! -name '*Native-Sources*' | sort)

          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "$GITHUB_SHA" != "$main_sha" ]; then
            echo "Skipping stale canary run at $GITHUB_SHA; main is now $main_sha."
            exit 0
          fi
          staging_tag="canary-staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          draft_id=""
          swap_started=false
          staging_promoted=false

          github_get_status() {
            local url="$1"
            local output="$2"
            local status
            if ! status="$(curl --silent --show-error --location \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --output "$output" \
              --write-out '%{http_code}' \
              "$url")"; then
              echo "GitHub API curl transport failed for $url." >&2
              return 1
            fi
            case "$status" in
              200|404) printf '%s' "$status" ;;
              *) echo "Unexpected GitHub API status $status for $url." >&2; return 1 ;;
            esac
          }

          cleanup_staging_ref() {
            local status
            status="$(github_get_status \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/${staging_tag}" \
              staging-ref.json)" || return 1
            if [ "$status" = "200" ]; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${staging_tag}" >/dev/null
            fi
          }

          cleanup_staging() {
            local original_status=$?
            local cleanup_status=0
            trap - EXIT
            if [ -n "$draft_id" ] && [ "$swap_started" != "true" ] && [ "$staging_promoted" != "true" ]; then
              local release_status
              if release_status="$(github_get_status \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${draft_id}" \
                staging-release.json)"; then
                if [ "$release_status" = "200" ]; then
                  gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${draft_id}" >/dev/null || cleanup_status=$?
                fi
              else
                cleanup_status=$?
              fi
            fi
            cleanup_staging_ref || cleanup_status=$?
            if [ "$original_status" -ne 0 ]; then
              exit "$original_status"
            fi
            exit "$cleanup_status"
          }

          draft_id="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name="$staging_tag" \
            -f target_commitish="$GITHUB_SHA" \
            -f name="Canary ${short} (not a release)" \
            -f body="$(cat canary-notes.md)" \
            -F draft=true \
            -F prerelease=true \
            -f make_latest=false \
            --jq .id)"
          if ! [[ "$draft_id" =~ ^[0-9]+$ ]]; then
            echo "GitHub did not return a draft release id." >&2
            exit 1
          fi
          trap cleanup_staging EXIT

          upload_asset() {
            local file="$1"
            local name
            name="$(basename "$file")"
            curl --fail-with-body --silent --show-error --location \
              --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --header 'Content-Type: application/octet-stream' \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${draft_id}/assets?name=${name}" \
              --data-binary "@${file}" >/dev/null
          }
          for asset in "${assets[@]}"; do upload_asset "$asset"; done
          upload_asset publish/SHA256SUMS.txt

          draft_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${draft_id}" --jq .tag_name)"
          draft_target="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${draft_id}" --jq .target_commitish)"
          draft_state="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${draft_id}" --jq '[.draft,.prerelease] | @tsv')"
          if [ "$draft_tag" != "$staging_tag" ] || [ "$draft_target" != "$GITHUB_SHA" ] || [ "$draft_state" != $'true\ttrue' ]; then
            echo "Temporary canary draft metadata does not match its candidate." >&2
            exit 1
          fi

          {
            for asset in "${assets[@]}"; do basename "$asset"; done
            echo SHA256SUMS.txt
          } | sort > expected-canary-assets.txt
          gh api "repos/${GITHUB_REPOSITORY}/releases/${draft_id}" --jq '.assets[].name' | sort > actual-canary-assets.txt
          diff -u expected-canary-assets.txt actual-canary-assets.txt

          {
            while read -r hash name; do
              printf '%s\tsha256:%s\n' "$name" "$hash"
            done < publish/SHA256SUMS.txt
            manifest_hash="$(sha256sum publish/SHA256SUMS.txt | cut -d' ' -f1)"
            printf 'SHA256SUMS.txt\tsha256:%s\n' "$manifest_hash"
          } | sort > expected-canary-digests.txt
          gh api "repos/${GITHUB_REPOSITORY}/releases/${draft_id}" \
            --jq '.assets[] | "\(.name)\t\(.digest)"' \
            | sort > actual-canary-digests.txt
          diff -u expected-canary-digests.txt actual-canary-digests.txt

          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "$GITHUB_SHA" != "$main_sha" ]; then
            echo "Skipping stale canary run after staging at $GITHUB_SHA; main is now $main_sha."
            exit 0
          fi

          canary_release_status="$(github_get_status \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/canary" \
            canary-release.json)"
          canary_ref_status="$(github_get_status \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/canary" \
            canary-ref.json)"
          swap_started=true
          if [ "$canary_release_status" = "200" ]; then
            gh release delete canary --yes
          fi
          if [ "$canary_ref_status" = "200" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/canary" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref=refs/tags/canary -f sha="$GITHUB_SHA" >/dev/null
          fi

          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${draft_id}" \
            -f tag_name=canary \
            -f name="Canary ${short} (not a release)" \
            -f body="$(cat canary-notes.md)" \
            -F draft=false \
            -F prerelease=true \
            -f make_latest=false >/dev/null
          staging_promoted=true

          tag_sha="$(git ls-remote --exit-code origin refs/tags/canary | cut -f1)"
          if [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "Published canary tag resolves to $tag_sha, not $GITHUB_SHA." >&2
            exit 1
          fi
          fixed_target="$(gh release view canary --json targetCommitish --jq .targetCommitish)"
          fixed_state="$(gh release view canary --json isDraft,isPrerelease --jq '[.isDraft,.isPrerelease] | @tsv')"
          fixed_url="$(gh release view canary --json url --jq .url)"
          if [ "$fixed_target" != "$GITHUB_SHA" ] || [ "$fixed_state" != $'false\ttrue' ]; then
            echo "Published fixed-tag canary metadata does not match its candidate." >&2
            exit 1
          fi
          case "$fixed_url" in
            */releases/tag/canary) ;;
            *) echo "Published canary URL is not the fixed /releases/tag/canary path." >&2; exit 1 ;;
          esac
          gh release view canary --json assets --jq '.assets[].name' | sort > actual-fixed-canary-assets.txt
          diff -u expected-canary-assets.txt actual-fixed-canary-assets.txt
          gh release view canary --json assets \
            --jq '.assets[] | "\(.name)\t\(.digest)"' \
            | sort > actual-fixed-canary-digests.txt
          diff -u expected-canary-digests.txt actual-fixed-canary-digests.txt
          bad_downloads="$(gh release view canary --json assets \
            --jq '[.assets[] | select((.url | contains("/releases/download/canary/")) | not)] | length')"
          if [ "$bad_downloads" != "0" ]; then
            echo "Published canary assets do not use the fixed /releases/download/canary/ path." >&2
            exit 1
          fi

          printf '%s prerelease=true target=%s\n' "$fixed_url" "$fixed_target"
