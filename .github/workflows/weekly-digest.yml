name: Weekly digest

# Monday morning: one issue with the PRs waiting for a review, the ones waiting on their authors, new
# issues nobody has answered yet and issues waiting for their reporters. The previous digest closes.
on:
  schedule:
    - cron: '7 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digest:
    if: github.repository == 'totec448-spec/chat-on-steroids'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      issues: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Open this week's digest
        run: node scripts/weekly-digest.mjs
