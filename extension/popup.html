<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title data-i18n="extension_action_title">Chat On Steroids</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="shell">
      <svg class="defs" aria-hidden="true">
        <defs>
          <g id="i-tab"><rect x="2.5" y="3.5" width="15" height="11" rx="2" /><path d="M7 17.5h6" /></g>
          <g id="i-rec"><path d="M3 10h2M7 5.5v9M11 7.5v5M15 9v2M17.5 10H19" /></g>
          <g id="i-hash"><path d="M4 7.5h12M4 12.5h12M8.5 3.5 7 16.5M14 3.5l-1.5 13" /></g>
          <g id="i-req"><rect x="3.5" y="3" width="13" height="14" rx="2" /><path d="M6.5 7.5h7M6.5 10.5h7M6.5 13.5h4" /></g>
          <g id="i-send"><path d="M17 3 9 11M17 3l-5.5 14.5L9 11 2.5 8.5 17 3Z" /></g>
          <g id="i-down"><path d="M10 3v9M6 8.5l4 4 4-4M3.5 16.5h13" /></g>
          <g id="i-check"><path d="M17 5.5 8.2 14.5 3.5 10" /></g>
          <g id="i-pen"><path d="M13.5 3.5 16.5 6.5 7 16H4v-3l9.5-9.5Z" /></g>
          <g id="i-clock"><circle cx="10" cy="10" r="7" /><path d="M10 6v4.3l2.8 1.7" /></g>
          <g id="i-more"><path d="M3 6h5M12 6h5M3 14h9M16 14h1" /><circle cx="10" cy="6" r="2" /><circle cx="14" cy="14" r="2" /></g>
        </defs>
      </svg>

      <header>
        <img class="glyph" src="icons/icon48.png" alt="" width="34" height="34" />
        <h1 data-i18n="extension_action_title">Chat On Steroids</h1>
      </header>

      <p class="pill off" id="pill"><span class="dot"></span><span id="state" data-i18n="popup_state_looking_for_app">Looking for the app</span></p>


      <p class="alert" id="alert" hidden></p>
      <p class="caption" data-i18n="popup_section_session_capture">Session capture</p>
      <section class="card">
        <div class="row" id="r-tab">
          <svg class="ico"><use href="#i-tab" /></svg>
          <span class="name" data-i18n="popup_chatgpt_tab">ChatGPT tab</span>
          <span class="meta" id="d-tab"></span>
          <span class="badge"></span>
      </div>
      <div class="row" id="r-rec">
        <svg class="ico"><use href="#i-rec" /></svg>
        <span class="name" data-i18n="popup_recording_this_chat">Recording this chat</span>
        <span class="meta" id="d-rec"></span>
        <span class="badge"></span>
      </div>
      <div class="row" id="r-chat">
        <svg class="ico"><use href="#i-hash" /></svg>
        <span class="name" data-i18n="popup_chat_id">Chat ID</span>
        <button class="meta copy" id="d-chat" type="button" aria-label="Copy chat ID" data-i18n-aria-label="popup_copy_chat_id"></button>
        <span class="badge"></span>
      </div>
      <div class="row" id="r-req">
        <svg class="ico"><use href="#i-req" /></svg>
        <span class="name" data-i18n="popup_current_request">Current request</span>
        <button class="meta copy" id="d-req" type="button" aria-label="Copy current request ID" data-i18n-aria-label="popup_copy_current_request_id"></button>
        <span class="badge"></span>
      </div>
      <details id="stream">
        <summary class="row" id="r-app">
          <svg class="ico"><use href="#i-send" /></svg>
          <span class="name" data-i18n="popup_reaching_app">Reaching the app</span>
          <span class="meta" id="d-app"></span>
          <span class="badge"></span>
          <span class="chevron" aria-hidden="true"></span>
        </summary>
        <div class="stages">
          <div class="stage" id="s-read"><span class="tick"></span><span class="name" data-i18n="popup_request_id_found">Request ID found</span><span class="meta" id="n-read"></span></div>
          <div class="stage" id="s-sent"><span class="tick"></span><span class="name" data-i18n="popup_sent_to_app">Sent to app</span><span class="meta" id="n-sent"></span></div>
          <div class="stage" id="s-proc"><span class="tick"></span><span class="name" data-i18n="popup_owner_confirmed">Owner confirmed</span><span class="meta" id="n-proc"></span></div>
          <p class="why" id="why"></p>
          <div class="calls" id="calls"></div>
        </div>
      </details>
    </section>


    <p class="caption" data-i18n="popup_section_augment_chatgpt">Augment ChatGPT</p>
    <section class="card">
      <label class="row" for="overwriteToggle">
        <svg class="ico"><use href="#i-pen" /></svg>
        <span class="name" data-i18n="popup_overwrite_chatgpt">Overwrite ChatGPT</span>
        <input id="overwriteToggle" type="checkbox" checked />
        <span class="track" aria-hidden="true"><span class="thumb"></span></span>
      </label>
      <label class="row" for="timeToggle">
        <svg class="ico"><use href="#i-clock" /></svg>
        <span class="name" data-i18n="popup_timestamps">Timestamps</span>
        <input id="timeToggle" type="checkbox" />
        <span class="track" aria-hidden="true"><span class="thumb"></span></span>
      </label>
    </section>

    <details id="more">
      <summary class="card row">
        <svg class="ico"><use href="#i-more" /></svg>
        <span class="name" data-i18n="popup_advanced">Advanced</span>
        <span class="chevron" aria-hidden="true"></span>
      </summary>
      <dl class="grid" id="grid"></dl>
      <div class="actions">
        <button id="copyBtn" type="button" data-i18n="popup_copy">Copy</button>
        <button id="retryBtn" type="button" hidden data-i18n="popup_try_again">Try again</button>
      </div>
    </details>

    </div>
    <script src="i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
